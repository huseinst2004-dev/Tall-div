<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القسمة الطويلة خطوة بخطوة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#2d2a4a; --muted:#7a7799;
  --quo:#16a34a; --dvs:#e11d48; --dvd:#2d2a4a; --prd:#ea580c; --dif:#2563eb; --brg:#9333ea;
  --hl-y:#fde68a; --hl-g:#bbf7d0; --hl-o:#fed7aa; --hl-p:#e9d5ff; --hl-b:#bfdbfe;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(#ffe2b8 1.5px,transparent 1.5px);background-size:26px 26px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{text-align:center;margin-bottom:10px}
h1{margin:4px 0;font-size:clamp(22px,4vw,34px);font-weight:800}
h1 span{color:var(--dvs)}
.sub{color:var(--muted);margin:0;font-size:15px}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 0 #f1dfc0,0 10px 30px rgba(0,0,0,.06);padding:14px 16px}
.setup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}
.field{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.field input{width:130px;font:800 24px 'Cairo';text-align:center;border:3px solid #eadfcb;border-radius:14px;padding:4px 8px;color:var(--ink);direction:ltr}
.field input:focus{outline:none;border-color:#f59e0b}
#dvdIn{color:var(--dvd)} #dvsIn{color:var(--dvs);width:100px}
.op{font-size:30px;font-weight:800;color:var(--muted);margin-top:16px}
button{font-family:'Cairo';font-weight:800;border:none;border-radius:14px;cursor:pointer;padding:8px 16px;font-size:16px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.45;cursor:default;transform:none}
.b-go{background:#f59e0b;color:#fff;margin-top:16px}
.b-ex{background:#e0f2fe;color:#075985}
.b-ex2{background:#fce7f3;color:#9d174d}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.tg{background:#f3f0ff;color:#5b21b6;font-size:14px;padding:6px 12px}
.tg.on{background:#7c3aed;color:#fff}
.err{color:var(--dvs);font-weight:700;width:100%;text-align:center;min-height:0;margin:0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;border:3px solid #eee;font-weight:800;font-size:16px;transition:all .3s;color:var(--muted)}
.chip i{font-style:normal;font-size:18px}
.chip.on{transform:scale(1.12);color:#fff}
.chip[data-s=divide].on{background:var(--quo);border-color:var(--quo)}
.chip[data-s=multiply].on{background:var(--prd);border-color:var(--prd)}
.chip[data-s=subtract].on{background:var(--dif);border-color:var(--dif)}
.chip[data-s=bring].on{background:var(--brg);border-color:var(--brg)}
.cyc{color:var(--muted);font-size:20px;align-self:center}
.main{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.boardWrap{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;min-height:260px;padding:14px 4px;position:relative}
.board{position:relative;direction:ltr}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;transition:color .3s,opacity .3s;z-index:2}
.cell.dvd{color:var(--dvd)} .cell.dvs{color:var(--dvs)} .cell.quo{color:var(--quo)}
.cell.prd{color:var(--prd)} .cell.dif{color:var(--dif)} .cell.brg{color:var(--brg)}
.cell.op{color:var(--prd)} .cell.dim{opacity:.25}
.cell.tag{justify-content:flex-start;white-space:nowrap;font-size:16px !important;color:var(--muted);padding-left:6px;width:auto !important}
.hl{position:absolute;border-radius:12px;z-index:1;transition:all .35s ease}
.hl.y{background:var(--hl-y)} .hl.g{background:var(--hl-g)} .hl.o{background:var(--hl-o)} .hl.p{background:var(--hl-p)} .hl.b{background:var(--hl-b)}
.ln{position:absolute;height:4px;background:var(--ink);border-radius:2px;z-index:2;transform-origin:right}
.brk{position:absolute;z-index:2;overflow:visible}
.a-pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.a-drop{animation:drop .9s cubic-bezier(.4,1.3,.6,1)}
@keyframes drop{0%{transform:translateY(var(--dy));opacity:.4;text-shadow:0 0 12px var(--brg)}70%{opacity:1}100%{transform:none}}
.a-grow{animation:grow .5s ease-out}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.a-fade{animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{display:flex;flex-direction:column;gap:10px}
.stepNo{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.txt{font-size:18px;line-height:1.9;min-height:120px}
.txt b{font-weight:800}
.txt .quo{color:var(--quo)} .txt .dvs{color:var(--dvs)} .txt .prd{color:var(--prd)} .txt .dif{color:var(--dif)} .txt .brg{color:var(--brg)}
.txt .chk{display:inline-block;margin-top:6px;background:#ecfdf5;border-radius:10px;padding:2px 10px;color:#065f46}
.txt.anim{animation:fade .4s}
.table{display:none;grid-template-columns:repeat(3,1fr);gap:6px}
.table.show{display:grid}
.tbl-title{display:none;font-size:13px;color:var(--muted);font-weight:700}
.tbl-title.show{display:block}
.tc{background:#f8f6ff;border-radius:10px;padding:3px 4px;text-align:center;font-weight:700;font-size:15px;direction:rtl}
.tc.ok{background:var(--hl-g);color:#14532d;outline:3px solid var(--quo)}
.tc.big{background:#ffe4e6;color:#9f1239;text-decoration:line-through}
.ask{display:none;background:#fff7ed;border:3px dashed #fdba74;border-radius:16px;padding:10px;gap:8px;flex-direction:column}
.ask.show{display:flex}
.ask .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ask input{width:110px;font:800 24px 'Cairo';text-align:center;border:3px solid #fdba74;border-radius:12px;padding:2px;direction:ltr}
.ask input:focus{outline:none;border-color:#ea580c}
.b-chk{background:var(--quo);color:#fff}
.b-help{background:#fef3c7;color:#92400e;font-size:14px}
.fb{font-weight:700;min-height:1.5em}
.fb.ok{color:var(--quo)} .fb.no{color:var(--dvs)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.b-prev{background:#e5e7eb;color:#374151}
.b-next{background:#16a34a;color:#fff;font-size:20px;padding:10px 28px}
.b-play{background:#dbeafe;color:#1e40af}
.b-reset{background:#fee2e2;color:#991b1b}
.speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.prog{height:10px;background:#f1e7d6;border-radius:999px;overflow:hidden;margin-top:12px}
.prog div{height:100%;background:linear-gradient(90deg,#f59e0b,#16a34a);width:0;transition:width .4s}
.stars{font-weight:800;color:#b45309}
.burst{position:absolute;font-size:26px;pointer-events:none;z-index:5;animation:fly 1.4s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.2) rotate(240deg);opacity:0}}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:700;margin-top:8px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:4px;background:currentColor}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>القسمة الطويلة <span>خطوة بخطوة</span> ✏️</h1>
    <p class="sub">القسمة على عدد مكوّن من مرتبتين أو ثلاث مراتب</p>
  </header>

  <div class="card setup">
    <div class="field">المقسوم<input id="dvdIn" inputmode="numeric" maxlength="7"></div>
    <div class="op">÷</div>
    <div class="field">المقسوم عليه<input id="dvsIn" inputmode="numeric" maxlength="3"></div>
    <button class="b-go" id="goBtn">ابدأ 🚀</button>
    <button class="b-ex" id="ex2">مثال: مرتبتان 🎲</button>
    <button class="b-ex2" id="ex3">مثال: ثلاث مراتب 🎲</button>
    <p class="err" id="err"></p>
    <div class="toggles">
      <button class="tg" id="practiceBtn">🎯 وضع التمرين: مطفأ</button>
      <button class="tg" id="digitsBtn">الأرقام: ١٢٣</button>
      <span class="stars" id="stars"></span>
    </div>
  </div>

  <div class="chips">
    <div class="chip" data-s="divide"><i>➗</i>١ اقسم</div>
    <div class="chip" data-s="multiply"><i>✖️</i>٢ اضرب</div>
    <div class="chip" data-s="subtract"><i>➖</i>٣ اطرح</div>
    <div class="chip" data-s="bring"><i>⬇️</i>٤ أنزل</div>
    <div class="cyc">🔁</div>
  </div>

  <div class="main">
    <div class="card">
      <div class="boardWrap" id="boardWrap"><div class="board" id="board"></div></div>
      <div class="legend">
        <span style="color:var(--dvd)">المقسوم</span>
        <span style="color:var(--dvs)">المقسوم عليه</span>
        <span style="color:var(--quo)">الناتج</span>
        <span style="color:var(--prd)">حاصل الضرب</span>
        <span style="color:var(--dif)">الفرق</span>
        <span style="color:var(--brg)">الرقم النازل</span>
      </div>
    </div>
    <div class="card panel">
      <div class="stepNo"><span id="stepNo"></span><span id="stageName"></span></div>
      <div class="txt" id="txt"></div>
      <div class="ask" id="ask">
        <div id="askQ" style="font-weight:800;font-size:18px"></div>
        <div class="row">
          <input id="askIn" inputmode="numeric" maxlength="5">
          <button class="b-chk" id="chkBtn">تحقّق ✔</button>
          <button class="b-help" id="helpBtn">مساعدة 💡</button>
          <button class="b-help" id="showBtn" style="display:none">أرني الجواب</button>
        </div>
        <div class="fb" id="fb"></div>
      </div>
      <div class="tbl-title" id="tblTitle"></div>
      <div class="table" id="table"></div>
    </div>
  </div>

  <div class="nav">
    <button class="b-prev" id="prevBtn">→ السابق</button>
    <button class="b-next" id="nextBtn">التالي ←</button>
    <button class="b-play" id="playBtn">▶ تشغيل تلقائي</button>
    <div class="speed">🐢<input type="range" id="speed" min="800" max="4000" step="200" value="2400" style="direction:ltr;width:90px">🐇</div>
    <button class="b-reset" id="resetBtn">↺ من البداية</button>
  </div>
  <div class="prog"><div id="prog"></div></div>
</div>

<script>
const AR='٠١٢٣٤٥٦٧٨٩';
let eastern=true, practice=false;
const fd=x=>eastern?String(x).replace(/\d/g,c=>AR[c]):String(x);
const norm=s=>s.replace(/[٠-٩]/g,c=>AR.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[^\d]/g,'');
const $=id=>document.getElementById(id);

let N=0,D=0,steps=[],idx=0,pending=null,answered=new Set(),prevIds=new Set(),timer=null,stars=0,wrongs=0,helpShown=false;
const STAGE={look:'👀 ننظر',divide:'➗ اقسم',multiply:'✖️ اضرب',subtract:'➖ اطرح',bring:'⬇️ أنزل',done:'🎉 النتيجة'};

function divText(cur,d,q){
  let t=`كم مرة يدخل <b class=dvs>${fd(d)}</b> في <b>${fd(cur)}</b>؟ 🤔<br>`;
  if(q===0) return t+`${fd(cur)} أصغر من ${fd(d)}، فلا يدخل فيه ولا مرة!<br>إذن نكتب <b class=quo>${fd(0)}</b> في الناتج.`;
  const rd=Math.max(10,Math.round(d/10)*10);
  let e=Math.min(9,Math.floor(cur/rd));
  t+=`فكّر: ${fd(d)} قريب من ${fd(rd)}، و${fd(rd)} يدخل في ${fd(cur)} حوالي ${fd(e)} مرات.<br>`;
  const tr=[];let x=e;
  if(x*d>cur){while(x*d>cur){tr.push(`${fd(d)} × ${fd(x)} = ${fd(x*d)} أكبر من ${fd(cur)} ❌`);x--;}}
  else{while((x+1)*d<=cur&&x<9){if(x>0)tr.push(`${fd(d)} × ${fd(x)} = ${fd(x*d)} يمكن أن نزيد 🔼`);x++;}}
  tr.push(`${fd(d)} × ${fd(x)} = ${fd(x*d)} ✔️`);
  return t+tr.join('<br>')+`<br>إذن نكتب <b class=quo>${fd(q)}</b> فوق.`;
}

function build(Nv,d){
  const s=String(Nv),n=s.length,dg=[...s].map(Number),m=String(d).length;
  const cells=[],lines=[],out=[];
  dg.forEach((v,i)=>cells.push({id:'D'+i,row:1,col:i,t:v,c:'dvd'}));
  [...String(d)].forEach((v,i)=>cells.push({id:'S'+i,row:1,col:i-m-1,t:v,c:'dvs'}));
  const dvsHl={row:1,c1:-m-1,c2:-2,k:'y'};
  const snap=o=>out.push(Object.assign({cells:cells.map(c=>({...c})),lines:lines.map(l=>({...l})),hl:[]},o));
  snap({stage:'look',text:`نريد أن نقسم <b>${fd(Nv)}</b> على <b class=dvs>${fd(d)}</b>.<br>العدد ${fd(Nv)} هو <b>المقسوم</b> 🍬 والعدد <b class=dvs>${fd(d)}</b> هو <b class=dvs>المقسوم عليه</b>.<br>تذكّر الخطوات الأربع: <b class=quo>اقسم</b> ← <b class=prd>اضرب</b> ← <b class=dif>اطرح</b> ← <b class=brg>أنزل</b> ثم نكرّر! 🔁`});
  const finish=(row)=>{
    const Q=Math.floor(Nv/d),R=Nv%d;
    cells.push({id:'TQ',row:0,col:n,t:'◄ الناتج',c:'tag',a:'fade'});
    cells.push({id:'TR',row:row,col:n,t:'◄ الباقي',c:'tag',a:'fade'});
    const qc=Math.max(0,n-String(Q).length);
    snap({stage:'done',done:true,hl:[{row:0,c1:qc,c2:n-1,k:'g'},{row:row,c1:n-String(R).length,c2:n-1,k:'b'}],
      text:`🎉 أحسنت! لا توجد أرقام أخرى لننزلها.<br>الناتج = <b class=quo>${fd(Q)}</b> ${R?`والباقي = <b class=dif>${fd(R)}</b>`:'والباقي صفر، القسمة تامة 👏'}<br><span class=chk>للتحقق: ${fd(Q)} × ${fd(d)}${R?' + '+fd(R):''} = ${fd(Nv)} ✔️</span>`});
  };
  if(Nv<d){
    cells.push({id:'Q'+(n-1),row:0,col:n-1,t:0,c:'quo',a:'pop'});
    snap({stage:'divide',hl:[{row:1,c1:0,c2:n-1,k:'y'},dvsHl],text:`المقسوم ${fd(Nv)} أصغر من ${fd(d)}، إذن الناتج <b class=quo>${fd(0)}</b> والباقي هو ${fd(Nv)} نفسه.`,ask:{type:'divide',ans:0,cur:Nv,d}});
    finish(1);return out;
  }
  let i=0,cur=dg[0];const tried=[];
  while(cur<d&&i<n-1){tried.push(cur);i++;cur=cur*10+dg[i];}
  snap({stage:'look',hl:[{row:1,c1:0,c2:i,k:'y'},dvsHl],text:'نبدأ من اليسار، ونأخذ أرقاماً من المقسوم حتى نحصل على عدد يدخل فيه '+fd(d)+':<br>'+
    tried.map(p=>`${fd(p)} أصغر من ${fd(d)} ❌ نأخذ رقماً آخر`).join('<br>')+(tried.length?'<br>':'')+`<b>${fd(cur)}</b> أكبر من ${fd(d)} ✔️ نبدأ به!`});
  let curRow=1,R=2;
  while(true){
    const q=Math.floor(cur/d),len=String(cur).length;
    const curHl={row:curRow,c1:i-len+1,c2:i,k:'y'};
    cells.push({id:'Q'+i,row:0,col:i,t:q,c:'quo',a:'pop'});
    snap({stage:'divide',hl:[curHl,dvsHl],text:divText(cur,d,q),table:{d,q,cur},
      ask:{type:'divide',ans:q,cur,d,prompt:`كم مرة يدخل ${fd(d)} في ${fd(cur)}؟ اكتب الرقم الذي نضعه فوق.`}});
    let r=cur;
    if(q>0){
      const p=q*d,ps=String(p);
      [...ps].forEach((v,j)=>cells.push({id:`P${R}_${j}`,row:R,col:i-ps.length+1+j,t:v,c:'prd',a:'pop'}));
      cells.push({id:'M'+R,row:R,col:i-ps.length,t:'−',c:'op',a:'fade'});
      lines.push({id:'L'+R,row:R,c1:Math.min(i-ps.length+1,curHl.c1),c2:i});
      snap({stage:'multiply',hl:[{row:0,c1:i,c2:i,k:'g'},dvsHl],text:`نضرب الرقم الذي كتبناه في المقسوم عليه:<br><b class=quo>${fd(q)}</b> × <b class=dvs>${fd(d)}</b> = <b class=prd>${fd(p)}</b><br>ونكتب الناتج تحت ${fd(cur)} تماماً.`,
        ask:{type:'multiply',ans:p,prompt:`كم يساوي ${fd(q)} × ${fd(d)}؟`}});
      r=cur-p;const rs=String(r);
      [...rs].forEach((v,j)=>cells.push({id:`R${R+1}_${j}`,row:R+1,col:i-rs.length+1+j,t:v,c:'dif',a:'pop'}));
      snap({stage:'subtract',hl:[curHl,{row:R,c1:i-ps.length+1,c2:i,k:'o'}],text:`نطرح: <b>${fd(cur)}</b> − <b class=prd>${fd(p)}</b> = <b class=dif>${fd(r)}</b><br>${fd(r)} أصغر من ${fd(d)} ✔️ هذا يعني أن اختيارنا صحيح.`,
        ask:{type:'subtract',ans:r,prompt:`كم يساوي ${fd(cur)} − ${fd(p)}؟`}});
      curRow=R+1;R+=2;
    }
    if(i===n-1){finish(curRow);return out;}
    i++;
    if(r===0) cells.forEach(c=>{if(c.row===curRow&&c.col<i&&c.c!=='op')c.c+=' dim';});
    cells.push({id:'B'+i,row:curRow,col:i,t:dg[i],c:'brg',a:'drop',dr:curRow-1});
    const nc=r*10+dg[i];
    snap({stage:'bring',hl:[{row:1,c1:i,c2:i,k:'p'},{row:curRow,c1:i,c2:i,k:'p'}],text:`نُنزل الرقم التالي من المقسوم وهو <b class=brg>${fd(dg[i])}</b> ⬇️ ونكتبه بجانب ${fd(r)}.<br>يصبح العدد الجديد <b>${fd(nc)}</b>، ونكرّر الخطوات من جديد 🔁`});
    cur=nc;
  }
}

/* ---------- rendering ---------- */
let geom={cw:50,rh:58,off:4};
function layout(){
  const last=steps[steps.length-1];
  let minC=0,maxC=0,maxR=1;
  last.cells.forEach(c=>{minC=Math.min(minC,c.col);maxC=Math.max(maxC,c.col);maxR=Math.max(maxR,c.row);});
  const cols=(maxC+2)-minC+1;
  const avail=$('boardWrap').clientWidth-16;
  const cw=Math.max(24,Math.min(54,Math.floor(avail/cols)));
  geom={cw,rh:Math.round(cw*1.12),off:-minC,cols,rows:maxR+1};
}
function render(i,question){
  const st=question?steps[i-1]:steps[i],info=steps[i];
  const {cw,rh,off}=geom,b=$('board');
  b.style.width=geom.cols*cw+'px';b.style.height=geom.rows*rh+'px';
  const n=String(N).length;
  let h='';
  const W=n*cw+cw*.4;
  h+=`<svg class="brk" style="left:${(off-1)*cw+cw*.55}px;top:${rh-3}px" width="${W}" height="${rh}"><path d="M2 3 L${W} 3 M2 3 Q${cw*.38} ${rh/2} 2 ${rh-2}" fill="none" stroke="#2d2a4a" stroke-width="4" stroke-linecap="round"/></svg>`;
  info.hl.forEach(r=>{h+=`<div class="hl ${r.k}" style="left:${(r.c1+off)*cw+2}px;top:${r.row*rh+5}px;width:${(r.c2-r.c1+1)*cw-4}px;height:${rh-10}px"></div>`;});
  const now=new Set();
  st.lines.forEach(l=>{now.add(l.id);const a=prevIds.has(l.id)?'':' a-grow';
    h+=`<div class="ln${a}" style="left:${(l.c1+off)*cw-cw*.6}px;top:${(l.row+1)*rh-3}px;width:${(l.c2-l.c1+1)*cw+cw*.6}px"></div>`;});
  st.cells.forEach(c=>{now.add(c.id);const a=(!prevIds.has(c.id)&&c.a)?' a-'+c.a:'';
    const dy=c.dr?`--dy:${-c.dr*rh}px;`:'';
    h+=`<div class="cell ${c.c}${a}" style="${dy}left:${(c.col+off)*cw}px;top:${c.row*rh}px;width:${cw}px;height:${rh}px;font-size:${cw*.68}px">${c.c.startsWith('tag')?c.t:fd(c.t)}</div>`;});
  b.innerHTML=h;
  prevIds=now;
  // panel
  document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('on',ch.dataset.s===info.stage));
  $('stepNo').textContent=`الخطوة ${fd(i+1)} من ${fd(steps.length)}`;
  $('stageName').textContent=STAGE[info.stage]||'';
  const tx=$('txt');tx.classList.remove('anim');void tx.offsetWidth;tx.classList.add('anim');
  const ask=$('ask');
  if(question){
    tx.innerHTML='🎯 دورك الآن! فكّر وأجب:';
    ask.classList.add('show');$('askQ').innerHTML=info.ask.prompt||'';
    $('askIn').value='';$('fb').textContent='';$('fb').className='fb';$('showBtn').style.display='none';
    setTimeout(()=>$('askIn').focus(),50);
    showTable(info.stage==='divide'&&helpShown?info.table:null,true);
  }else{
    tx.innerHTML=info.text;ask.classList.remove('show');
    showTable(info.table,false);
  }
  $('prevBtn').disabled=i===0&&!question;
  $('nextBtn').disabled=!!question||i===steps.length-1;
  $('prog').style.width=((question?i-1:i)/(steps.length-1)*100)+'%';
  if(info.done&&!question)celebrate();
}
function showTable(t,hideAns){
  const tb=$('table'),tt=$('tblTitle');
  if(!t){tb.classList.remove('show');tt.classList.remove('show');return;}
  tt.textContent=`جدول ضرب ${fd(t.d)} يساعدنا:`;tt.classList.add('show');
  let h='';for(let k=1;k<=9;k++){const v=k*t.d;let c='';
    if(!hideAns){if(k===t.q)c='ok';else if(k===t.q+1)c='big';}
    h+=`<div class="tc ${c}">${fd(t.d)} × ${fd(k)} = ${fd(v)}</div>`;}
  tb.innerHTML=h;tb.classList.add('show');
}
function celebrate(){
  const w=$('boardWrap');const em=['⭐','🎉','✨','🌟','🎈'];
  for(let k=0;k<16;k++){const s=document.createElement('div');s.className='burst';s.textContent=em[k%em.length];
    s.style.left='50%';s.style.top='40%';s.style.setProperty('--x',(Math.random()*360-180)+'px');s.style.setProperty('--y',(Math.random()*240-160)+'px');
    w.appendChild(s);setTimeout(()=>s.remove(),1500);}
}

/* ---------- navigation ---------- */
function next(){
  if(pending!==null||idx>=steps.length-1)return;
  const t=idx+1;
  if(practice&&steps[t].ask&&!answered.has(t)){pending=t;wrongs=0;helpShown=false;render(t,true);}
  else{idx=t;render(idx);}
  if(idx>=steps.length-1)stopPlay();
}
function prev(){
  if(pending!==null){pending=null;render(idx);return;}
  if(idx>0){idx--;render(idx);}
}
function check(){
  if(pending===null)return;
  const raw=norm($('askIn').value);if(raw==='')return;
  const g=parseInt(raw,10),a=steps[pending].ask,fb=$('fb');
  if(g===a.ans){
    stars++;updStars();fb.className='fb ok';fb.textContent=['ممتاز! 🌟','رائع! 👏','أحسنت! 🎉','صحيح! 💯'][stars%4];
    answered.add(pending);const t=pending;pending=null;
    setTimeout(()=>{idx=t;render(idx);},700);
  }else{
    wrongs++;fb.className='fb no';
    let m='حاول مرة أخرى 💪';
    if(a.type==='divide'){
      if(g*a.d>a.cur)m=`${fd(a.d)} × ${fd(g)} = ${fd(g*a.d)} وهذا أكبر من ${fd(a.cur)}، جرّب رقماً أصغر 🔽`;
      else if(a.cur-g*a.d>=a.d)m=`${fd(a.d)} × ${fd(g)} = ${fd(g*a.d)}، والباقي سيكون ${fd(a.cur-g*a.d)} وهو أكبر من ${fd(a.d)}، جرّب رقماً أكبر 🔼`;
    }
    fb.textContent=m;
    const inp=$('askIn');inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select();
    if(wrongs>=2)$('showBtn').style.display='';
  }
}
function updStars(){$('stars').textContent=practice?`⭐ × ${fd(stars)}`:'';}
function play(){
  if(timer){stopPlay();return;}
  if(practice){$('err').textContent='التشغيل التلقائي يعمل عندما يكون وضع التمرين مطفأً.';return;}
  if(idx>=steps.length-1){idx=0;prevIds=new Set();render(0);}
  $('playBtn').textContent='⏸ إيقاف';
  const tick=()=>{next();if(idx<steps.length-1)timer=setTimeout(tick,+$('speed').value);else stopPlay();};
  timer=setTimeout(tick,+$('speed').value);
}
function stopPlay(){clearTimeout(timer);timer=null;$('playBtn').textContent='▶ تشغيل تلقائي';}

function start(Nv,Dv){
  stopPlay();
  N=Nv;D=Dv;steps=build(N,D);idx=0;pending=null;answered=new Set();prevIds=new Set();
  $('dvdIn').value=fd(N);$('dvsIn').value=fd(D);$('err').textContent='';
  layout();render(0);
}
function go(){
  const a=parseInt(norm($('dvdIn').value)||'0',10),b=parseInt(norm($('dvsIn').value)||'0',10);
  if(!(b>=10&&b<=999)){$('err').textContent='اكتب مقسوماً عليه من مرتبتين أو ثلاث (من ١٠ إلى ٩٩٩).';return;}
  if(!(a>=1&&a<=9999999)){$('err').textContent='اكتب مقسوماً من ١ إلى ٧ مراتب.';return;}
  start(a,b);
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function example(m){
  let d,n;
  if(m===2){d=rnd(12,98);if(d%10===0)d++;n=rnd(d*11,Math.min(9999,d*150));}
  else{d=rnd(102,989);if(d%10===0)d+=3;n=rnd(d*11,Math.min(99999,d*120));}
  start(n,d);
}

$('goBtn').onclick=go;
$('dvdIn').onkeydown=$('dvsIn').onkeydown=e=>{if(e.key==='Enter')go();};
$('ex2').onclick=()=>example(2);$('ex3').onclick=()=>example(3);
$('nextBtn').onclick=next;$('prevBtn').onclick=prev;$('playBtn').onclick=play;
$('resetBtn').onclick=()=>{stopPlay();idx=0;pending=null;prevIds=new Set();render(0);};
$('chkBtn').onclick=check;
$('askIn').onkeydown=e=>{if(e.key==='Enter')check();};
$('helpBtn').onclick=()=>{
  if(pending===null)return;const s=steps[pending];
  if(s.stage==='divide'){helpShown=true;showTable(s.table,true);$('fb').className='fb';$('fb').textContent='استعن بجدول الضرب: ابحث عن أكبر ناتج لا يزيد على '+fd(s.ask.cur);}
  else if(s.stage==='multiply'){$('fb').className='fb';$('fb').textContent='فكّر: اضرب الآحاد أولاً، ثم العشرات، ثم المئات.';}
  else{$('fb').className='fb';$('fb').textContent='اطرح الآحاد أولاً، وإذا لم يكفِ استلف من المرتبة التي على اليسار.';}
};
$('showBtn').onclick=()=>{if(pending===null)return;$('askIn').value=fd(steps[pending].ask.ans);$('fb').className='fb';$('fb').textContent='هذا هو الجواب، اضغط تحقّق لنكمل 👍';};
$('practiceBtn').onclick=()=>{
  practice=!practice;stopPlay();
  $('practiceBtn').classList.toggle('on',practice);
  $('practiceBtn').textContent='🎯 وضع التمرين: '+(practice?'يعمل':'مطفأ');
  pending=null;updStars();render(idx);
};
$('digitsBtn').onclick=()=>{
  eastern=!eastern;$('digitsBtn').textContent='الأرقام: '+(eastern?'١٢٣':'123');
  steps=build(N,D);$('dvdIn').value=fd(N);$('dvsIn').value=fd(D);
  prevIds=new Set(steps[pending!==null?pending-1:idx].cells.map(c=>c.id));
  render(pending!==null?pending:idx,pending!==null);updStars();
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft'||e.key===' '){e.preventDefault();next();}
  if(e.key==='ArrowRight'){e.preventDefault();prev();}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!steps.length)return;layout();
  prevIds=new Set(steps[pending!==null?pending-1:idx].cells.map(c=>c.id).concat(steps[pending!==null?pending-1:idx].lines.map(l=>l.id)));
  render(pending!==null?pending:idx,pending!==null);},150);});

start(9876,23);
</script>
